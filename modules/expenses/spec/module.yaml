schemaVersion: 1
id: expenses.core
specVersion: 0.8.3
status: approved
name: Expense Claims
description: Provides tenant-scoped expense claims with employee ownership, submission, manager decisions, status filtering, and approval reporting.
profile: full
capabilities:
  - api
  - database
  - client
  - translations
dependencies:
  - id: system.core
    range: ^0.8.0
  - id: auth.core
    range: ^0.14.0
  - id: exports.core
    range: ^0.2.0
requires:
  - id: exports.lists.v1
    optional: true
tenancy: required
locales:
  - en
  - pl
invariants:
  - Every expense claim is owned by exactly one tenant and every query uses the trusted tenant identifier.
  - Persistence runs on the shared asynchronous database contract. The module receives a leased PostgreSQL handle from platform composition, never a driver or a connection string, and declares explicit PostgreSQL SQL for every statement and migration without translating between dialects.
  - PostgreSQL claim and history tables enable and force row-level security with USING and WITH CHECK policies bound to transaction-local coreloom.tenant_id, and the runtime role holds neither SUPERUSER nor BYPASSRLS. Migrations use a separate lease.
  - The claimant identity comes from the authenticated principal and is never accepted from request input.
  - Monetary amounts are stored as non-negative integer minor units with an explicit three-letter currency code.
  - A claim category is travel, meals, equipment, or other, and a claim status is draft, submitted, approved, or rejected.
  - Every new claim starts as draft, and only its claimant may change, submit, or delete it while it remains draft.
  - A claim moves only from draft to submitted and from submitted to approved or rejected.
  - Approving or rejecting requires expenses.claims.approve and a non-empty decision comment; that permission does not allow changing another claimant's draft.
  - A principal without approval permission can read only their own claims, while a principal with approval permission can read submitted claims awaiting a decision in the active tenant.
  - User-facing copy resolves from the active locale with English as the fallback and never renders a missing translation as empty content.
  - An expense note may reference only the linked fields in the same claim form; its raw template and one-pass resolved note are both retained without recursive resolution.
  - The claims list is read one signed keyset page at a time over (sort column, id) in one direction, with limit at most 200 and 50 by default, sort keys createdAt (the default, newest first), amount and expenseDate, and status, category and title search filters applied in SQL. The cursor is signed with a module secret drawn at composition and binds the tenant, the sort, the direction and a digest of the filters, so a tampered, foreign-tenant, resorted or refiltered cursor answers 400 CURSOR_INVALID and an unknown sort answers 400 INVALID_INPUT. A cursor is answered only on a full page, and no unbounded claims read exists.
  - The claims list export registered with exports.lists.v1 as expenses.core.claims declares the title, claimant, amount in minor units, currency, category, expense date, status and decision comment columns, is behind expenses.claims.read, and is walked by exports.core under the principal that started the job through the same page the list route answers, so a file never carries a row the screen would not have shown. A deployment without exports.core still composes expenses.core and registers nothing.
  - The bulk routes approve-many, reject-many and submit-many are siblings of the single approve, reject and submit routes with the same permission and CSRF check, accept 1 to 100 unique claim ids, and run the single decision or submission path per id, so each row keeps its own history version and a missing or foreign-tenant id answers not-found while a claim in the wrong status or owned by someone else answers refused with the single route's code. A bulk decision with a blank comment records the fixed default bulk review comment, so a decided claim never stores an empty one.
  - The data class export writes every claim and every history revision of exactly one tenant, read in bounded pages inside the module's own tenant-scoped transaction. Neither class is swept or erased, because claims and their revision trail are accounting records that leave only when a person deletes a draft, and erasure is not a subject right over them.
permissions:
  - id: expenses.claims.read
    description: Read expense claims visible to the principal in the active tenant.
  - id: expenses.claims.manage
    description: Create, change, and submit the principal's own draft expense claims in the active tenant.
  - id: expenses.claims.approve
    description: Read the active tenant approval queue and approve or reject submitted expense claims.
dataOwnership:
  - expenses.core owns claim identity, claimant identity, title, amount in minor units, currency, category, expense date, optional note, status, and decision comment.
  - Authentication supplies the trusted tenant and principal identities used for claim ownership and authorization.
  - expenses.core declares the data classes expenses.core.claims (the expenses_claims table) and expenses.core.claims-history (the expenses_claims_history table); both are exportable with no retention period, and the export writes every row of the requesting tenant through the module service.
acceptanceScenarios:
  - id: EXPENSES-LIST
    given: Expense claims in different statuses and categories exist for more than one claimant in the active tenant.
    when: A principal with expenses.claims.read lists claims with a sort key, a direction, a limit, a cursor, and any of the status, category and title search filters.
    then: A principal without expenses.claims.approve receives one page of only their own matching claims in the requested order with the identifier as the tie-breaker, a principal with it also receives the tenant's submitted claims, two consecutive pages share no row and skip none, a full page carries the next cursor and a short page none, and a tampered, foreign-tenant, resorted or refiltered cursor answers 400 CURSOR_INVALID.
  - id: EXPENSES-APPROVAL-QUEUE
    given: Submitted claims from multiple claimants and claims in other statuses exist in the active tenant.
    when: A principal with expenses.claims.approve requests claims awaiting a decision.
    then: Only submitted claims owned by the active tenant are returned, one signed page at a time in the same order and with the same cursor rules as the list.
  - id: EXPENSES-LIST-EXPORT
    given: exports.core composed either before or after expenses.core and a principal holding expenses.claims.read in a tenant with more visible claims than one export page carries.
    when: exports.core walks expenses.core.claims for a job that principal started, while another tenant holds claims of its own.
    then: The file carries the header and every claim the principal may read exactly once with its title, claimant, amount in minor units, currency, category, expense date, status and decision comment, no claim of the other tenant appears, the list is registered exactly once whichever module composed first, and a deployment without exports.core composes expenses.core with no list registered.
  - id: EXPENSES-BULK-DECISION
    given: Submitted claims, a draft, a foreign-tenant claim and a missing identifier are named together by a principal with expenses.claims.approve.
    when: The principal calls approve-many or reject-many with 1 to 100 unique ids and an optional comment.
    then: The server answers one outcome per id in order, updated for each submitted claim now decided with the comment or the default bulk review comment, not-found for the missing and foreign ids, refused with CLAIM_NOT_SUBMITTED for the draft, records one history version per decided row, and refuses an empty, oversized or repeated id list with 400 INVALID_INPUT and a bad CSRF token with 403 before any row changes.
  - id: EXPENSES-BULK-SUBMIT
    given: The principal's own drafts, another claimant's draft, a submitted claim and a missing identifier are named together by a principal with expenses.claims.manage.
    when: The principal calls submit-many.
    then: The server answers updated for each own draft now submitted, refused with CLAIM_NOT_OWNED or CLAIM_NOT_DRAFT for the others, not-found for the missing id, and records one history version per submitted row.
  - id: EXPENSES-CREATE
    given: A principal with expenses.claims.manage supplies a title, non-negative integer minor-unit amount, three-letter currency code, allowed category, valid expense date, and optional note.
    when: The principal creates an expense claim.
    then: The server returns 201 and persists a draft claim owned by the active tenant and authenticated principal.
  - id: EXPENSES-INVALID
    given: A principal supplies a missing title, invalid amount, invalid currency code, unsupported category, invalid expense date, or non-string note.
    when: The principal attempts to create or change a draft claim.
    then: The server returns 400 with the stable error code INVALID_CLAIM_INPUT and persists no change.
  - id: EXPENSES-UPDATE-DRAFT
    given: A principal owns a draft expense claim in the active tenant.
    when: The principal changes its title, amount, currency, category, expense date, or note with expenses.claims.manage.
    then: The server returns 200 with the updated draft claim and leaves its tenant and claimant identities unchanged.
  - id: EXPENSES-SUBMIT
    given: A principal owns a valid draft expense claim in the active tenant.
    when: The principal submits it with expenses.claims.manage.
    then: The server returns 200, changes the status to submitted, and prevents further changes to the claim fields.
  - id: EXPENSES-DELETE-DRAFT
    given: A principal owns a draft expense claim in the active tenant.
    when: The principal deletes it with expenses.claims.manage.
    then: The server removes the draft, keeps its append-only revision history for audit, and refuses deletion by another claimant or after submission.
  - id: EXPENSES-OWNERSHIP-DENY
    given: A principal holds expenses.claims.manage but does not own the target claim.
    when: The principal attempts to change or submit that claim.
    then: The server returns 403 with the stable error code CLAIM_NOT_OWNED and leaves the claim unchanged.
  - id: EXPENSES-NOT-DRAFT
    given: A claim is submitted, approved, or rejected.
    when: Its claimant attempts to change or submit it again.
    then: The server returns 409 with the stable error code CLAIM_NOT_DRAFT and leaves the claim unchanged.
  - id: EXPENSES-APPROVE
    given: A submitted claim exists in the active tenant and the decision actor holds expenses.claims.approve.
    when: The actor approves it with a non-empty comment.
    then: The server returns 200 and stores the approved status and decision comment without changing the claim fields or ownership.
  - id: EXPENSES-REJECT
    given: A submitted claim exists in the active tenant and the decision actor holds expenses.claims.approve.
    when: The actor rejects it with a non-empty comment.
    then: The server returns 200 and stores the rejected status and decision comment without changing the claim fields or ownership.
  - id: EXPENSES-DECISION-DENY
    given: A principal lacks expenses.claims.approve or the target claim is not submitted.
    when: The principal attempts to approve or reject the claim.
    then: The server returns 403 FORBIDDEN for the missing permission or 409 CLAIM_NOT_SUBMITTED for the invalid status before changing data.
  - id: EXPENSES-DENY
    given: A principal is unauthenticated or lacks the permission required by an expense claim endpoint.
    when: The principal reads or mutates expense claim data.
    then: The server returns 401 UNAUTHENTICATED or 403 FORBIDDEN before repository access.
  - id: EXPENSES-ISOLATION
    given: A claim belongs to a different tenant from the authenticated principal.
    when: The principal lists, changes, submits, approves, or rejects expense claims.
    then: The foreign claim is absent from lists, direct actions return 404 CLAIM_NOT_FOUND, and no foreign-tenant data changes.
  - id: EXPENSES-SCREEN
    given: The expense claims screen is opened by a principal with or without expenses.claims.read and its list request may be loading, empty, successful, or failed.
    when: The principal views the list, sorts a column, changes the status or category filter, types a title search, moves between pages, or starts a new claim.
    then: The screen shows loading, empty, error, populated, filtered-empty, and denied outcomes; the server-paged list keeps one cursor per visited page, resets them on a sort, filter, search or page size change, ignores a late answer to an older request, and the title, amount, currency, category, expense date, and optional note form opens in a drawer.
  - id: EXPENSES-DECISION-SCREEN
    given: A principal with expenses.claims.approve can see a submitted claim in the active tenant.
    when: The principal selects approve or reject from that claim and supplies a decision comment.
    then: The screen submits the selected decision, shows validation or server errors without losing the list, and refreshes the claim status and awaiting-approval count after success.
  - id: EXPENSES-BULK-SCREEN
    given: A principal with expenses.claims.approve or expenses.claims.manage sees a page of claims.
    when: The principal selects rows and chooses Approve selected, Reject selected or Submit selected.
    then: Only submitted claims are selectable for a decision and only drafts for a submission, an action with nothing decidable or submittable is disabled with a reason, a confirm dialog with an optional comment precedes a decision, the selection is emptied after the action and on every new listing, and a toast reports the updated, missing and refused counts.
  - id: EXPENSES-DASHBOARD
    given: Submitted and non-submitted claims exist in the active tenant.
    when: A principal with expenses.claims.approve opens the dashboard.
    then: A scoped tile receives only the count of submitted claims awaiting approval in the active tenant and links to the approval queue; principals without the permission do not see the tile.
  - id: EXPENSES-HISTORY
    given: A claim is created, updated, submitted, and decided in the active tenant.
    when: A principal with expenses.claims.read opens that claim's history.
    then: The history returns append-only revisions with the performing user or agent actor; a non-approver cannot read another claimant's history and no tenant can read another tenant's revisions.
  - id: EXPENSES-NOTE-VARIABLES
    given: A claimant writes an expense note using a linked field such as expense.title.
    when: The claim is created or changed.
    then: The server rejects an unknown token before persistence and stores both the raw template and its one-pass resolved note in the active tenant.
