schemaVersion: 1
id: parties.core
specVersion: 0.10.3
status: approved
name: Business Parties Core
description: Provides the tenant-scoped customer and supplier master data used by commercial ERP modules.
profile: full
capabilities:
  - api
  - database
  - client
  - translations
dependencies:
  - id: system.core
    range: ^0.8.0
  - id: auth.core
    range: ^0.14.0
  - id: exports.core
    range: ^0.2.0
requires:
  - id: exports.lists.v1
    optional: true
tenancy: required
locales:
  - en
  - pl
invariants:
  - Persistence runs on the shared asynchronous database contract. The module receives a leased PostgreSQL handle from platform composition, never a driver or a connection string, and declares explicit PostgreSQL SQL for every statement and migration.
  - PostgreSQL party, history, and idempotency ledger tables enable and force row-level security with USING and WITH CHECK policies bound to transaction-local coreloom.tenant_id, and the runtime role holds neither SUPERUSER nor BYPASSRLS. Migrations use a separate lease.
  - Every party row is owned by exactly one tenant and every query includes the trusted tenant identifier.
  - Party kind is customer, supplier, or both.
  - Archived parties remain addressable by identifier and are excluded from active selection by default.
  - A party must be archived before it can be deleted permanently, while its append-only history remains available for audit.
  - Party identifiers are generated by the service and never accepted as tenancy authority.
  - Background workflow actions preserve their service actor and the configuring user in record history.
  - One tenant-scoped durable target ledger is shared by mutating agent tools and workflow actions; each entry binds an idempotency key to the exact tool identifier or versioned workflow action identifier, canonical input digest, and first persisted result in the same transaction as the party mutation.
  - Replaying the same idempotency key for the same operation and canonical input returns the original result without another party or history row, while reuse for another operation or input fails with a stable conflict.
  - Idempotency ledger entries remain after a party is deleted, and audit metadata records identifiers, input digests, and outcomes without raw tool input, credentials, secrets, or result payloads.
  - The party list is read one keyset page at a time, never whole. A page is at most 200 rows (50 by default) in one of two orders, the lower-cased name or the last update time, each paired with the id and carried by its own index, and the kind, status, VAT presence and search filters are applied in SQL. The page cursor is signed with a module secret drawn at composition and binds the tenant, the sort, the direction and a digest of the filters, so a cursor presented under another tenant, order or filter set is refused with CURSOR_INVALID rather than spliced into another listing.
  - The list export registered with exports.lists.v1 as parties.core.records declares the name, kind, VAT id, contact and status columns, is behind parties.records.read and walks the list endpoint's own default page under the principal that started the job, so a file can never carry a row of another tenant. A deployment without exports.core still composes parties.core and registers nothing.
  - Archiving or reactivating a selection runs the single-row lifecycle path once per id, at most 100 unique ids per call, and answers one outcome per id (updated, not-found or refused with the reason code), so every row keeps its own history entry, a missing or foreign id refuses only itself, and the idempotency ledger is untouched because the interactive routes never write it.
  - The data class export of one tenant reads every row of that tenant and no other through the module's own tenant-scoped transaction. No data class carries a retention period, a sweep, or an erasure, because parties and their history leave only when a person deletes the party, and the idempotency ledger stays durable and is excluded from the export with a stated reason.
permissions:
  - id: parties.records.read
    description: Read customers and suppliers in the active tenant.
  - id: parties.records.manage
    description: Create and update customers and suppliers in the active tenant.
dataOwnership:
  - parties.core owns party identity, kind, contact summary, and lifecycle status.
  - parties.core owns the idempotency ledger for its mutating agent tools and workflow actions; callers supply the key but do not maintain a second target ledger.
  - Commercial modules reference party identifiers and do not duplicate party master data.
  - parties.core declares three platform data classes, parties.core.parties (the parties table), parties.core.history (parties_history_v2 and the superseded parties_history it absorbed), and parties.core.idempotency-ledger (parties_idempotency_ledger). Parties and history are exportable and each export pages through every row of one tenant; the ledger is not exportable because it is operational replay evidence whose parties are exported by parties.core.parties.
acceptanceScenarios:
  - id: PARTIES-LIST
    given: Tenant-scoped customer and supplier records exist.
    when: An authorized principal lists parties page by page, sorted by name or last update, filtered by kind, status, VAT presence or a search term.
    then: Only records owned by the active tenant are returned, two consecutive pages neither overlap nor skip a row, a full page carries a cursor and a short page none, and a tampered, foreign-tenant or refiltered cursor or an unknown sort answers 400.
  - id: PARTIES-EXPORT-LIST
    given: exports.core composed and registered its list capability.
    when: parties.core composes and a principal with parties.records.read starts an export of parties.core.records.
    then: The catalogue lists parties.core.records and the job streams every party of the principal's tenant with the declared columns.
  - id: PARTIES-BULK-LIFECYCLE
    given: An authorized principal selects parties on the Customers or Suppliers screen.
    when: The principal confirms Archive selected or runs Reactivate selected, including a missing id and an id of another tenant.
    then: Each id answers its own outcome, the archived or restored rows carry their own history entries, the untouched ids report not-found, and a body without 1 to 100 unique ids, without a CSRF token or without parties.records.manage is refused before any write.
  - id: PARTIES-CREATE
    given: An authorized principal supplies a valid name, kind, and optional contact fields.
    when: The party is created.
    then: A tenant-owned active party is persisted and returned with a generated identifier.
  - id: PARTIES-SEPARATE-SCREENS
    given: Customer, supplier, and combined party records exist in the active tenant.
    when: An authorized principal opens the Customers or Suppliers screen.
    then: Each screen lists its matching records, and a combined party appears on both screens.
  - id: PARTIES-LIFECYCLE
    given: An authorized principal manages a party in the active tenant.
    when: The principal archives, restores, or permanently deletes an archived party.
    then: The lifecycle change is tenant-scoped, recorded in append-only history, and an active party cannot be deleted permanently.
  - id: PARTIES-DENY
    given: A principal is unauthenticated or lacks the required party permission.
    when: The principal reads or mutates party data.
    then: The server denies the operation before repository access.
  - id: PARTIES-AGENT-TOOL
    given: An agent run holds parties.records.manage in its permission snapshot and the tool parties.customer.create in its grants.
    when: The agent invokes the tool with a valid party, and a run without the manage scope invokes the same tool.
    then: The scoped run creates a tenant-owned party from the run tenant and the harness denies the unscoped run before any write.
  - id: PARTIES-WORKFLOW-ACTIONS
    given: A workflow revision selects a versioned party read, create or update action and carries the matching permission snapshot.
    when: The action capability validates and executes the node with an idempotency key and service actor.
    then: The action exposes exact input and output schemas, refuses a missing permission before work, cooperates with cancellation, and attributes a created party to the service and its configuring user.
  - id: PARTIES-IDEMPOTENCY-REPLAY
    given: A mutating party tool or workflow action has committed a party mutation and its target-ledger result for an idempotency key.
    when: The caller repeats the exact operation with the same canonical input and key, including after losing the first response.
    then: The module returns the original persisted result and creates no second party or history row.
  - id: PARTIES-AGENT-UPDATE
    given: An agent is explicitly granted parties.customer.update and holds parties.records.manage in its saved ceiling and live permissions.
    when: It submits a party id and one or more changed fields, including concurrent requests or a retry after restart.
    then: Only supplied fields change in the trusted tenant, null clears optional contacts, audit records the run actor, and the atomic target ledger replays the first result without another write. Empty or invalid patches, cross-tenant records and missing grants are refused.
  - id: PARTIES-IDEMPOTENCY-CONFLICT
    given: A tenant-scoped idempotency key is already bound to an exact party tool identifier or versioned workflow action identifier and canonical input digest.
    when: A caller reuses the key for a different operation or canonical input.
    then: The module returns a stable conflict before any party, history, or ledger write.
  - id: PARTIES-IDEMPOTENCY-RECOVERY
    given: A party record has been committed atomically with its idempotency result, or the party is later deleted through its lifecycle operation.
    when: Recovery replays the mutating tool or workflow action with the same key.
    then: The retained ledger returns the original result without another mutation, and audit evidence contains no raw input, credentials, secrets, or result payload.
